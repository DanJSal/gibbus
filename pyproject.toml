[build-system]
requires = [
    "setuptools>=77",  # PEP 639 `license = "MIT"` / `license-files`
    "wheel",
    "Cython>=3.0",
    "numpy>=1.23",
]
build-backend = "setuptools.build_meta"

[project]
name = "gibbus"
version = "0.1.0"
description = "Flexible maximum-likelihood modeling of smooth univariate log-concave distributions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Daniel Salib"},
]
maintainers = [
    {name = "Daniel Salib"},
]


requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.urls]
Homepage = "https://github.com/DanJSal/gibbus"
Repository = "https://github.com/DanJSal/gibbus"
Issues = "https://github.com/DanJSal/gibbus/issues"
Documentation = "https://github.com/DanJSal/gibbus#readme"


[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["gibbus*"]

[tool.setuptools.package-data]
"gibbus" = ["py.typed"]
"*" = ["*.pyx"]

[tool.cibuildwheel]
# Release wheels cover the package's declared CPython support range.
build = "cp3{10,11,12,13,14}-*"

# PyPI release support is glibc Linux, Windows x86-64, and both macOS
# architectures. Alpine/musl is not part of the 0.1.0 release target.
skip = ["*-musllinux_*"]

# cibuildwheel installs each wheel into a fresh test virtual environment and
# executes tests from a temporary directory outside the source checkout.
test-requires = ["pytest>=7.0"]
test-sources = ["tests"]
test-command = [
    "python tests/wheel_smoke.py",
    "python -m pytest -q tests/test_api.py tests/test_serialization_v1.py tests/test_fitted_state.py tests/test_model_ownership.py",
]

[tool.cibuildwheel.linux]
# glibc 2.17 provides a deliberately broad x86-64 compatibility floor.
manylinux-x86_64-image = "manylinux2014"
