[build-system]
requires = [
    "setuptools>=77",  # PEP 639 `license = "MIT"` / `license-files`
    "wheel",
    "Cython>=3.0",
    "numpy>=1.23",
]
build-backend = "setuptools.build_meta"

[project]
name = "gibbus"
version = "0.2.0"
description = "Flexible maximum-likelihood modeling of smooth univariate log-concave distributions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Daniel Salib"},
]
maintainers = [
    {name = "Daniel Salib"},
]
keywords = [
    "statistics",
    "probability",
    "log-concave",
    "density estimation",
    "maximum likelihood",
    "mixture models",
    "censored data",
    "survival analysis",
]

requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.urls]
Homepage = "https://github.com/DanJSal/gibbus"
Repository = "https://github.com/DanJSal/gibbus"
Issues = "https://github.com/DanJSal/gibbus/issues"

[project.optional-dependencies]
test = ["mpmath>=1.3", "pytest>=7.0", "pytest-cov", "pytest-xdist>=3.0", "sympy>=1.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["gibbus*"]

[tool.setuptools.package-data]
"gibbus" = ["py.typed"]
"*" = ["*.pyx", "*.pxd", "*.hpp"]

[tool.cibuildwheel]
# Release wheels cover the package's declared CPython support range.
build = "cp3{11,12,13,14}-*"

# PyPI release support is glibc Linux, Windows x86-64, and both macOS
# architectures. Alpine/musl is not a supported release target.
skip = ["*-musllinux_*"]

# cibuildwheel installs each wheel into a fresh test virtual environment and
# executes tests from a temporary directory outside the source checkout.
test-requires = ["pytest>=7.0"]
test-sources = ["tests"]
test-command = [
    "python tests/wheel_smoke.py",
    "python -m pytest -q tests/test_api.py tests/test_serialization.py tests/test_fitted_state.py tests/test_model_ownership.py",
]

[tool.cibuildwheel.linux]
# Match the current binary compatibility floor of the SciPy dependency stack.
manylinux-x86_64-image = "manylinux_2_28"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
