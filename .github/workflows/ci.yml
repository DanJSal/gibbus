name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel

      - name: Install built wheel and test dependencies
        run: >-
          python -c "import pathlib, subprocess, sys;
          wheel = next(pathlib.Path('dist').glob('*.whl'));
          print(f'Installing {wheel}');
          subprocess.check_call([
          sys.executable, '-m', 'pip', 'install',
          str(wheel) + '[test]'
          ])"

      - name: Copy tests outside repository
        run: >-
          python -c "import os, pathlib, shutil;
          dst = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tests';
          shutil.copytree('tests', dst, dirs_exist_ok=True);
          print(dst)"

      - name: Verify installed package
        working-directory: ${{ runner.temp }}
        run: python tests/wheel_smoke.py

      - name: Run test suite
        working-directory: ${{ runner.temp }}
        run: >-
          python -m pytest -q -n auto tests
          --ignore=tests/test_selection_battery.py

  selection-battery:
    name: Selection battery / Ubuntu / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel

      - name: Install built wheel and test dependencies
        run: >-
          python -c "import pathlib, subprocess, sys;
          wheel = next(pathlib.Path('dist').glob('*.whl'));
          subprocess.check_call([
          sys.executable, '-m', 'pip', 'install',
          str(wheel) + '[test]'
          ])"

      - name: Copy tests outside repository
        run: >-
          python -c "import os, pathlib, shutil;
          dst = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tests';
          shutil.copytree('tests', dst, dirs_exist_ok=True)"

      - name: Run selection battery
        working-directory: ${{ runner.temp }}
        run: python -m pytest -q tests/test_selection_battery.py

  sdist:
    name: Source distribution / Ubuntu / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build source distribution
        run: python -m build --sdist

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install source distribution and test dependencies
        run: >-
          python -c "import pathlib, subprocess, sys;
          sdist = next(pathlib.Path('dist').glob('*.tar.gz'));
          print(f'Installing {sdist}');
          subprocess.check_call([
          sys.executable, '-m', 'pip', 'install',
          str(sdist) + '[test]'
          ])"

      - name: Copy tests outside repository
        run: >-
          python -c "import os, pathlib, shutil;
          dst = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tests';
          shutil.copytree('tests', dst, dirs_exist_ok=True)"

      - name: Verify installed source distribution
        working-directory: ${{ runner.temp }}
        run: python tests/wheel_smoke.py

      - name: Run packaging and serialization checks
        working-directory: ${{ runner.temp }}
        run: >-
          python -m pytest -q
          tests/test_serialization.py
          tests/test_api.py
          tests/test_fitted_state.py
          tests/test_model_ownership.py
